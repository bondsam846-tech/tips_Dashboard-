<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIPS — Test Integrity Platform (Demo)</title>
<script>(function(){var t="light";try{t=localStorage.getItem("tips_theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}document.documentElement.setAttribute("data-theme",t)})()</script>
<style>
:root{--surf:#fff;--surf2:#f8fafc;--grid:#eef2f6;color-scheme:light;--side:#0f172a;--side2:#1e293b;--sidetx:#cbd5e1;--bg:#f1f4f8;--card:#fff;--tx:#0f172a;--mut:#64748b;--bd:#e2e8f0;--pri:#2563eb;--prih:#1d4ed8;--ok:#15803d;--okb:#dcfce7;--wa:#a16207;--wab:#fef3c7;--er:#b91c1c;--erb:#fee2e2;--in:#1d4ed8;--inb:#dbeafe;--ne:#475569;--neb:#eef2f6}
*{box-sizing:border-box}
body{margin:0;font:13.5px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* sidebar */
aside{width:252px;background:var(--side);color:var(--sidetx);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:width .18s,transform .18s}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1e40af);display:grid;place-items:center;color:#fff;font-weight:700}
.bt b{color:#fff;display:block;font-size:15px}.bt span{font-size:11px;opacity:.65}
.psw{display:flex;margin:0 12px 10px;background:var(--side2);border-radius:8px;padding:3px}
.psw button{flex:1;border:0;background:none;color:var(--sidetx);padding:6px;border-radius:6px;cursor:pointer;font-size:12px}
.psw button.on{background:var(--pri);color:#fff}
nav{flex:1;overflow-y:auto;padding:0 8px 8px}
nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.5;padding:12px 10px 4px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;color:var(--sidetx);text-decoration:none;cursor:pointer;font-size:13px;white-space:nowrap}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:rgba(59,130,246,.22);color:#fff}
nav a .lk{margin-left:auto;opacity:.6}
.colbtn{border:0;border-top:1px solid #1e293b;background:none;color:var(--sidetx);padding:10px 16px;text-align:left;cursor:pointer;display:flex;gap:8px;align-items:center}
body.col aside{width:64px}body.col .bt,body.col .psw,body.col nav .grp,body.col nav a span,body.col nav a .lk,body.col .colbtn span{display:none}
body.col nav a{justify-content:center}body.col .colbtn .ic{transform:rotate(180deg)}
#main{margin-left:252px;min-height:100vh;transition:margin .18s}body.col #main{margin-left:64px}
/* topbar */
.top{height:56px;background:var(--surf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:30}
.mbtn{display:none}
.crumbs{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumbs b{color:var(--tx);font-weight:600}
.gs{position:relative;margin-left:auto;width:280px}
.gs input{width:100%;padding:7px 10px 7px 32px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.gs .ic{position:absolute;left:10px;top:9px;color:var(--mut)}
.gsr{position:absolute;top:38px;left:0;right:0;background:var(--surf);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);max-height:360px;overflow:auto;display:none}
.gsr div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}.gsr div:hover{background:var(--bg)}.gsr small{color:var(--mut);display:block}
.env{font-size:11px;font-weight:600;background:var(--wab);color:var(--wa);padding:3px 8px;border-radius:20px;white-space:nowrap}
.ibtn{border:1px solid var(--bd);background:var(--surf);border-radius:8px;height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;padding:0 8px}
.ibtn:hover{background:var(--bg)}
.dot{position:absolute;top:-5px;right:-5px;background:var(--er);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;line-height:16px}
.avatar{width:26px;height:26px;border-radius:50%;background:#1e40af;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.banner{background:var(--surf)beb;border-bottom:1px solid #fde68a;color:#854d0e;font-size:12px;padding:6px 20px}
.banner.bad{background:var(--erb);border-color:#fecaca;color:var(--er)}
#page{padding:20px;max-width:1500px}
/* page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:20px;margin:0}.ph p{margin:3px 0 0;color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--bd);background:var(--surf);padding:7px 12px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--prih)}
.btn.dan{background:var(--er);border-color:var(--er);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.g{display:grid;gap:14px;margin-bottom:14px}
.k4{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.c2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi{cursor:pointer;transition:border-color .15s}.kpi:hover{border-color:var(--pri)}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:26px;font-weight:650;margin:2px 0}.kpi .s{font-size:11.5px;color:var(--mut)}
.kpi .v.bad{color:var(--er)}.kpi .v.warn{color:var(--wa)}
.bd{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-wa{background:var(--wab);color:var(--wa)}.b-er{background:var(--erb);color:var(--er)}.b-in{background:var(--inb);color:var(--in)}.b-ne{background:var(--neb);color:var(--ne)}
/* table */
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.srch{position:relative}.srch input{padding:6px 10px 6px 30px;border:1px solid var(--bd);border-radius:7px;width:230px}.srch .ic{position:absolute;left:9px;top:8px;color:var(--mut)}
select,.inp{border:1px solid var(--bd);border-radius:7px;padding:6px 8px;background:var(--surf)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{background:var(--surf2);text-align:left;font-weight:600;color:var(--ne);padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
th.ns{cursor:default}th .ar{opacity:.5;font-size:10px}
td{padding:7px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--surf2)}tbody tr:last-child td{border-bottom:0}
.mono{font-family:Consolas,Menlo,monospace;font-size:12px}
.pg{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--mut);font-size:12px;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}.empty b{display:block;color:var(--tx);margin-bottom:4px}
/* menus, modal, drawer, toast */
.pop{position:fixed;background:var(--surf);border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.16);z-index:80;min-width:190px;padding:4px;display:none}
.pop button{display:flex;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer;gap:8px;align-items:center}
.pop button:hover{background:var(--bg)}.pop button.dz{color:var(--er)}.pop button[disabled]{opacity:.45;cursor:not-allowed}
.pop .hd{padding:8px 10px;font-size:11px;color:var(--mut);border-bottom:1px solid var(--bd);margin-bottom:4px}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--surf);border-radius:12px;width:min(560px,94vw);max-height:90vh;display:none;flex-direction:column;z-index:70;box-shadow:0 20px 50px rgba(15,23,42,.3)}
.mh{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}.mh b{font-size:15px}
.mb{padding:16px 18px;overflow-y:auto}.mf{padding:12px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px}
.x{border:0;background:none;cursor:pointer;padding:4px;border-radius:6px}.x:hover{background:var(--bg)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,96vw);background:var(--surf);z-index:70;transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(15,23,42,.2)}
.drawer.on{transform:none}
.dl{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}.dl dt{color:var(--mut)}.dl dd{margin:0;word-break:break-word}
.fld{margin-bottom:12px}.fld label{display:block;font-weight:600;font-size:12.5px;margin-bottom:4px}.fld label i{color:var(--er);font-style:normal}
.fld .inp,.fld select,.fld textarea{width:100%;border:1px solid var(--bd);border-radius:7px;padding:7px 9px;background:var(--surf)}
.fld.bad .inp,.fld.bad select,.fld.bad textarea{border-color:var(--er)}
.err{color:var(--er);font-size:11.5px;margin-top:3px;min-height:0}
.hint{color:var(--mut);font-size:11.5px;margin-top:3px}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{font-weight:400;display:flex;gap:5px;align-items:center;border:1px solid var(--bd);padding:4px 8px;border-radius:6px;margin:0;cursor:pointer}
.sw{position:relative;display:inline-block;width:36px;height:20px}.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;cursor:pointer;transition:.15s}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--pri)}.sw input:checked+span:before{transform:translateX(16px)}
.sw input:disabled+span{opacity:.5;cursor:not-allowed}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;align-items:center;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;min-width:260px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.2);border-left:4px solid var(--pri);font-size:13px;animation:ti .2s}
.toast.ok{border-color:#22c55e}.toast.er{border-color:#ef4444}.toast.wa{border-color:#f59e0b}
@keyframes ti{from{transform:translateY(10px);opacity:0}}
#tip{position:fixed;pointer-events:none;background:#0f172a;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;z-index:99;display:none;white-space:pre;line-height:1.5}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tabs button.on{color:var(--pri);border-color:var(--pri)}
.sk{background:linear-gradient(90deg,#e9eef5 25%,#f5f7fa 50%,#e9eef5 75%);background-size:200% 100%;animation:sh 1.1s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
svg.ch{width:100%;height:auto;display:block}svg.ch text{font-size:10.5px;fill:var(--mut)}svg.ch line{stroke:var(--grid)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ne);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.feed div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12.8px}.feed div:last-child{border:0}.feed small{color:var(--mut);white-space:nowrap;margin-left:auto}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{border:1px solid var(--bd);border-radius:10px;padding:14px;background:var(--surf)}.mod.off{background:var(--surf2)}
.mod h4{margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:6px}.mod p{margin:0 0 12px;color:var(--mut);font-size:12.5px}
.lock{max-width:560px;margin:40px auto;text-align:center}.lock .ico{width:52px;height:52px;border-radius:50%;background:var(--neb);display:grid;place-items:center;margin:0 auto 12px}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.svc{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}.svc:last-child{border:0}
.secret{background:#0f172a;color:#a7f3d0;padding:10px;border-radius:8px;word-break:break-all;margin:8px 0}
.note{font-size:11.5px;color:var(--mut);margin-top:6px}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:900px){aside{transform:translateX(-100%);width:252px!important}body.mob aside{transform:none}#main{margin-left:0!important}.mbtn{display:inline-flex}.gs{width:auto;flex:1}.crumbs{display:none}.c2{grid-template-columns:1fr}body.col .bt,body.col .psw,body.col nav .grp,body.col nav a span{display:initial}}
@media(max-width:560px){.top{padding:0 10px;gap:6px}.env,.hide-s{display:none}#page{padding:12px}.srch input{width:150px}}

.srch input{background:var(--surf)}
html[data-theme=dark]{--side:#020617;--side2:#0f172a;--bg:#0b1220;--card:#111a2c;--tx:#e5eaf3;--mut:#93a1b8;--bd:#25324a;--pri:#3b82f6;--prih:#2563eb;--ok:#4ade80;--okb:rgba(34,197,94,.16);--wa:#fbbf24;--wab:rgba(245,158,11,.16);--er:#f87171;--erb:rgba(239,68,68,.16);--in:#60a5fa;--inb:rgba(59,130,246,.18);--ne:#b4c0d3;--neb:#1b2740;--surf:#111a2c;--surf2:#162036;--grid:#1e2a42;color-scheme:dark}
html[data-theme=dark] .banner{background:#2a2108;border-color:#5a4511;color:#facc15}
html[data-theme=dark] .banner.bad{background:#2a1010;border-color:#5b1a1a;color:#fca5a5}
html[data-theme=dark] .sk{background:linear-gradient(90deg,#16203a 25%,#1d2a47 50%,#16203a 75%);background-size:200% 100%}
html[data-theme=dark] .ov{background:rgba(0,0,0,.6)}
html[data-theme=dark] .btn.dan,html[data-theme=dark] .btn.pri{color:#fff}
html[data-theme=dark] .btn.dan{background:#dc2626;border-color:#dc2626}
html[data-theme=dark] .pop button.dz{color:#f87171}
html[data-theme=dark] ::placeholder{color:#64748b}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">T</div><div class="bt"><b>TIPS</b><span>Test Integrity Platform</span></div></div>
  <div class="psw" id="psw"><button data-p="provider" onclick="App.portal('provider')">Provider Console</button><button data-p="customer" onclick="App.portal('customer')">Customer Portal</button></div>
  <nav id="nav"></nav>
  <button class="colbtn" onclick="App.collapse()" title="Collapse sidebar"></button>
</aside>
<div id="main">
  <header class="top">
    <button class="ibtn mbtn" onclick="document.body.classList.toggle('mob')" aria-label="Menu"></button>
    <div class="crumbs" id="crumbs"></div>
    <div class="gs"><span id="gsi"></span><input id="gsq" placeholder="Search tenants, cases, users, pages…" autocomplete="off" oninput="App.gsearch(this.value)" onfocus="App.gsearch(this.value)"><div class="gsr" id="gsr"></div></div>
    <select id="tsel" onchange="App.tenantSel(this.value)" aria-label="Tenant selector" style="max-width:220px"></select>
    <button class="ibtn" id="theme" onclick="App.theme()" aria-label="Toggle theme"></button>
    <button class="ibtn" id="bell" onclick="App.bell(event)" aria-label="Notifications"></button>
    <button class="ibtn" id="ubtn" onclick="App.umenu(event)" aria-label="User menu"></button>
  </header>
  <div id="banner"></div>
  <main id="page"></main>
</div>
<div class="ov" id="ov" onclick="App.closeAll()"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="drawer" id="drawer"></div>
<div class="pop" id="pop"></div>
<div id="toasts"></div>
<div id="tip"></div>
<script>
/* =====================================================================
   TIPS Demo — single-file SaaS demo. All data is SYNTHETIC and stored
   in this browser's localStorage. External integrations are SIMULATED.
   ===================================================================== */
'use strict';
const DAY=864e5, NOW=Date.now();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=t=>new Date(t).toISOString();
const fmtD=s=>s?new Date(s).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDT=s=>s?new Date(s).toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const ago=s=>{const m=Math.round((Date.now()-new Date(s))/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const num=n=>Number(n||0).toLocaleString();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
const kfmt=v=>v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(v>=1e4?0:1)+'k':String(Math.round(v));

    if(opt.area&&si===0)g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${c}" opacity=".08"/>`;g+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2"/>`});
  const bw=(W-L-R)/Math.max(1,n-1);labels.forEach((l,i)=>{const tip=l+'\n'+series.map(s=>`${s.name}: ${num(s.data[i])}`).join('\n');g+=`<rect x="${x(i)-bw/2}" y="${T}" width="${bw}" height="${H-T-Bm}" fill="transparent" data-tip="${esc(tip)}"/>`});

function barChart(labels,values,opt={}){

  const W=640,H=opt.h||220,L=42,R=10,T=10,Bm=30,mx=niceMax(Math.max(...values)),bw=(W-L-R)/n;let g='';
  for(let k=0;k<=4;k++){const v=mx*k/4,yy=H-Bm-v/mx*(H-T-Bm);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#eef2f6"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${kfmt(v)}</text>`}
  const step=Math.ceil(n/10);
  labels.forEach((l,i)=>{const h=values[i]/mx*(H-T-Bm),xx=L+i*bw+bw*.15;g+=`<rect x="${xx}" y="${H-Bm-h}" width="${bw*.7}" height="${Math.max(h,0)}" rx="2" fill="${opt.colors?opt.colors[i%opt.colors.length]:PAL[0]}" data-tip="${esc(l+': '+num(values[i]))}" ${opt.click?`style="cursor:pointer" onclick="${opt.click(i)}"`:''}/>`;if(i%step===0)g+=`<text x="${L+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${esc(String(l).slice(0,14))}</text>`});
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function donut(labels,values,opt={}){
  const tot=sum(values);if(!tot)return emptyHTML('No data for the selected filters');
  const cols=opt.colors||PAL;let a=-Math.PI/2,g='';const cx=90,cy=90,R=78,r=50;
  values.forEach((v,i)=>{if(!v)return;const a2=a+v/tot*Math.PI*2-(v===tot?1e-4:0),lg=a2-a>Math.PI?1:0;
    const p=(ang,rad)=>`${cx+rad*Math.cos(ang)},${cy+rad*Math.sin(ang)}`;
    g+=`<path d="M${p(a,R)} A${R},${R} 0 ${lg} 1 ${p(a2,R)} L${p(a2,r)} A${r},${r} 0 ${lg} 0 ${p(a,r)}Z" fill="${cols[i%cols.length]}" data-tip="${esc(labels[i]+': '+num(v)+' ('+Math.round(v/tot*100)+'%)')}" ${opt.click?`style="cursor:pointer" onclick="${opt.click(i)}"`:''}/>`;a=a2});
  g+=`<text x="${cx}" y="${cy-2}" text-anchor="middle" style="font-size:20px;font-weight:600;fill:var(--tx)">${kfmt(tot)}</text><text x="${cx}" y="${cy+15}" text-anchor="middle">${esc(opt.center||'total')}</text>`;

}

  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><div class="pg"><span>${tot?`Showing ${st.p*st.ps+1}–${Math.min(tot,(st.p+1)*st.ps)} of ${tot}`:'0 records'}</span><span class="fl">Rows <select onchange="App.tps('${id}',this.value)" aria-label="Rows per page">${[10,25,50].map(n=>`<option ${st.ps===n?'selected':''}>${n}</option>`).join('')}</select><button class="btn sm" ${st.p<=0?'disabled':''} onclick="App.tp('${id}',-1)">Prev</button><span>Page ${st.p+1} / ${pages}</span><button class="btn sm" ${st.p>=pages-1?'disabled':''} onclick="App.tp('${id}',1)">Next</button></span></div>`}
function refreshTable(id){const el=$('#tb-'+id);if(el)el.innerHTML=tableHTML(id)}

/* fields */
function fieldHTML(f,v,dis){const id='f_'+f.k,req=f.req?'<i>*</i>':'',d=dis?'disabled':'';let inp;const o=optList(f.opts);
  switch(f.t){case 'select':inp=`<select id="${id}" ${d}><option value="">Select…</option>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(v??'')===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;break;
  case 'multi':inp=`<div class="chk" id="${id}">${o.map(([a,b])=>`<label><input type="checkbox" value="${esc(a)}" ${(v||[]).includes(a)?'checked':''} ${d}>${esc(b)}</label>`).join('')}</div>`;break;
  case 'textarea':inp=`<textarea id="${id}" rows="3" ${d}>${esc(v??'')}</textarea>`;break;
  case 'bool':inp=`<label class="sw"><input type="checkbox" id="${id}" ${v?'checked':''} ${d}><span></span></label>`;break;
  case 'date':inp=`<input class="inp" type="date" id="${id}" value="${v?String(v).slice(0,10):''}" ${d}>`;break;
  default:inp=`<input class="inp" id="${id}" type="${f.t==='number'?'number':f.t==='email'?'email':'text'}" value="${esc(v??'')}" ${f.ph?`placeholder="${esc(f.ph)}"`:''} ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} ${f.t==='number'&&f.step?`step="${f.step}"`:''} ${d}>`}
  return `<div class="fld" id="w_${f.k}"><label for="${id}">${esc(f.l)} ${req}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}<div class="err" id="e_${f.k}"></div></div>`}
function readField(f){const el=$('#f_'+f.k);if(!el)return undefined;if(f.t==='multi')return[...el.querySelectorAll('input:checked')].map(i=>i.value);if(f.t==='bool')return el.checked;if(f.t==='number')return el.value===''?'':Number(el.value);if(f.t==='date')return el.value?iso(el.value+'T09:00:00'):'';return el.value.trim()}
function validate(fields,vals,ctx){const errs={};fields.forEach(f=>{const v=vals[f.k];
  if(f.req&&(v===''||v==null||(Array.isArray(v)&&!v.length)))errs[f.k]=f.t==='multi'?'Select at least one option':'This field is required';
  else if(v!==''&&v!=null&&!(Array.isArray(v)&&!v.length)){
    if(f.t==='number'&&(isNaN(v)||(f.min!=null&&v<f.min)||(f.max!=null&&v>f.max)))errs[f.k]=`Enter a number${f.min!=null?' ≥ '+num(f.min):''}${f.max!=null?' and ≤ '+num(f.max):''}`;
    else if(f.t==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))errs[f.k]='Enter a valid email address';
    else if(f.pat&&!f.pat.test(v))errs[f.k]=f.patMsg||'Invalid format';
    else if(f.maxLen&&String(v).length>f.maxLen)errs[f.k]=`Maximum ${f.maxLen} characters`;
    else if(f.unique&&ctx&&ctx.rows.some(r=>r.id!==ctx.id&&String(r[f.k]).toLowerCase()===String(v).toLowerCase()))errs[f.k]='This value is already in use';}
  if(!errs[f.k]&&f.check){const m=f.check(v,vals,ctx);if(m)errs[f.k]=m}});return errs}
function showErrs(fields,errs){fields.forEach(f=>{const w=$('#w_'+f.k);if(!w)return;w.classList.toggle('bad',!!errs[f.k]);$('#e_'+f.k).textContent=errs[f.k]||''});const k=Object.keys(errs)[0];if(k){const el=$('#f_'+k);el&&el.focus&&el.focus()}}
function formFields(S,editing){return(S.fields||[]).filter(f=>!(editing&&f.createOnly)&&!(!editing&&f.editOnly))}
function label(S,r){return S.label?S.label(r):(r.name||r.title||r.subject||r.key||r.id)}
/* config forms (non-table) */
function cfgForm(fid,fields,vals,save,dis){CFG[fid]={fields,save};return `<form onsubmit="event.preventDefault();App.cfgSave('${fid}',this.querySelector('.btn.pri'))" novalidate><div class="g c2" style="margin:0">${fields.map(f=>fieldHTML(f,vals[f.k],dis)).join('')}</div><div class="fl" style="justify-content:flex-end;margin-top:6px">${dis?`<span class="note">${ic('lock')} ${esc(dis)}</span>`:''}<button type="button" class="btn" onclick="App.rerender()" ${dis?'disabled':''}>Discard changes</button><button type="submit" class="btn pri" ${dis?'disabled':''}>Save changes</button></div></form>`}

  gsearch(q){const box=$('#gsr');q=q.trim().toLowerCase();if(q.length<2){box.style.display='none';return}const R=[];

    box.innerHTML=R.length?R.slice(0,12).map(([a,b,c])=>`<div onclick="$('#gsq').value='';${c}">${esc(a)}<small>${esc(b)}</small></div>`).join(''):`<div style="cursor:default;color:var(--mut)">No results for “${esc(q)}”</div>`;box.style.display='block'}
};

  b.modules.forEach(m=>{if(!DB.assign.some(a=>a.tenantId===t.id&&a.module===m))DB.assign.push({id:nid('ENT'),tenantId:t.id,module:m,enabled:t.status==='Active',note:t.status==='Active'?'Added by bundle change':'Awaiting activation'})})}

const randHex=n=>Array.from({length:n},()=>Math.floor(Math.random()*16).toString(16)).join('');

      r.status='Active';DB.tasks.filter(t=>t.tenantId===r.id&&t.status==='Queued').forEach(t=>{t.status='Completed';t.attempts++;t.updated=nowISO()});DB.assign.filter(a=>a.tenantId===r.id).forEach(a=>{a.enabled=true;a.note='Enabled on activation'});const s=DB.subs.find(s=>s.tenantId===r.id);if(s)s.status='Active';DB.users.filter(u=>u.tenantId===r.id&&u.status==='Invited').forEach(u=>u.status='Active');DB.exams.filter(e=>e.tenantId===r.id&&e.status==='Draft').forEach(e=>e.status='Scheduled');notify('customer','Tenant activated','Your TIPS tenant is now active.','c-overview',r.id);return ok(`${r.name} is now Active`)}},

    {l:'Open in Customer Portal',ic:'user',open:true,nolog:true,ms:1,run:r=>{UI.ctenant=r.id;UI.role='Customer Admin';App.go('c-overview');return{ok:null}}}],

const ptSel=()=>`<select onchange="App.tenantSel(this.value)" aria-label="Tenant filter"><option value="all">All tenants</option>${DB.tenants.map(t=>`<option value="${t.id}" ${UI.ptenant===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
const crudPage=(t,d,id,x)=>()=>ph(t,d,x)+`<div class="card">${crudHTML(id)}</div>`;
function provKPI(){const T=DB.tenants;return{tenants:T.length,active:T.filter(t=>t.status==='Active').length,prov:T.filter(t=>t.status==='Provisioning').length,susp:T.filter(t=>t.status==='Suspended').length,bundles:DB.bundles.filter(b=>b.status==='Active').length,assign:DB.assign.filter(a=>a.enabled).length,attn:DB.tasks.filter(t=>['Failed','Blocked'].includes(t.status)).length,degraded:DB.integrations.filter(i=>i.enabled&&i.status==='Degraded').length,inc:DB.incidents.filter(i=>i.status!=='Resolved').length}}
const scopeTenants=()=>DB.tenants.filter(t=>UI.ptenant==='all'||t.id===UI.ptenant);
const Pg=(g,t,ic,render,o)=>Object.assign({g,t,ic,render},o||{});

PAGES.overview=Pg('Overview','Global Overview','grid',()=>{const K=provKPI(),R=UI.range,ts=scopeTenants(),tids=ts.map(t=>t.id),lbl=dayLabels(R);
  const ver=seriesFor(tids,R),api=seriesFor(tids,R,true),prev=R<=45?sum(seriesFor(tids,R*2).slice(0,R)):null,cur=sum(ver);
  const months=Array.from({length:12},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-11+i);return d});
  const growth=months.map(m=>{const end=new Date(m.getFullYear(),m.getMonth()+1,1).getTime();return DB.tenants.filter(t=>new Date(t.created).getTime()<end).length});
  const st=['Active','Provisioning','Suspended'],stv=st.map(s=>DB.tenants.filter(t=>t.status===s).length);
  const bl=DB.bundles.map(b=>b.name),bv=DB.bundles.map(b=>ts.filter(t=>t.bundleId===b.id).length);
  const mv=MODS.map(m=>DB.assign.filter(a=>a.module===m[0]&&a.enabled&&tids.includes(a.tenantId)).length);
  const ih=['Healthy','Degraded','Not tested','Disabled'],ihv=[DB.integrations.filter(i=>i.enabled&&i.status==='Healthy').length,K.degraded,DB.integrations.filter(i=>i.enabled&&i.status==='Not tested').length,DB.integrations.filter(i=>!i.enabled).length];
  const since=Date.now()-R*DAY,pt=DB.tasks.filter(t=>tids.includes(t.tenantId)&&new Date(t.updated)>=since),ps=['Completed','Queued','Running','Failed','Blocked','Cancelled'],psv=ps.map(s=>pt.filter(t=>t.status===s).length);
  const feed=DB.audit.filter(a=>UI.ptenant==='all'||a.tenantId===UI.ptenant).slice(0,8);
  const dlt=prev?Math.round((cur-prev)/Math.max(prev,1)*100):null;
  return ph('Global Overview','Platform-wide operational view across all customer tenants · demo data',rangeSel()+ptSel())+
  `<div class="g k4">${kpi('Customer tenants',K.tenants,'Click to manage tenants',"App.go('tenants',{})")}${kpi('Active tenants',K.active,Math.round(K.active/Math.max(K.tenants,1)*100)+'% of tenants',"App.go('tenants',{f:{status:'Active'}})")}${kpi('Awaiting provisioning',K.prov,'Tenants not yet live',"App.go('tenants',{f:{status:'Provisioning'}})",K.prov?'warn':'')}${kpi('Suspended tenants',K.susp,'Access disabled',"App.go('tenants',{f:{status:'Suspended'}})",K.susp?'bad':'')}${kpi('Commercial bundles',K.bundles,'Active bundles',"App.go('bundles',{})")}${kpi('Enabled module assignments',K.assign,'Tenant × module entitlements',"App.go('subscriptions',{tab:'ent',spec:'assign',f:{en:'Enabled'}})")}${kpi('Tasks needing attention',K.attn,'Failed or blocked provisioning',"App.go('provisioning',{f:{attn:'Needs attention'}})",K.attn?'bad':'')}${kpi('Degraded integrations',K.degraded,'Connections below SLO',"App.go('integrations',{tab:'conn',spec:'integrations',f:{status:'Degraded'}})",K.degraded?'warn':'')}${kpi('Open incidents',K.inc,'Platform incidents',"App.go('health',{spec:'incidents',f:{status:''}})",K.inc?'bad':'')}${kpi(`Verifications (${R}d)`,kfmt(cur),dlt==null?(UI.ptenant==='all'?'All tenants':tName(UI.ptenant)):`${dlt>=0?'▲':'▼'} ${Math.abs(dlt)}% vs previous ${R}d`,"App.go('usage',{})")}</div>
  <div class="g c2"><div class="card"><h3>Verification volume <span class="note">${UI.ptenant==='all'?'All tenants':esc(tName(UI.ptenant))} · last ${R} days</span></h3>${lineChart(lbl,[{name:'Verifications',data:ver}],{area:1})}</div>
  <div class="card"><h3>API request volume <span class="note">last ${R} days</span></h3>${lineChart(lbl,[{name:'API requests',data:api,color:'#7c3aed'}],{area:1})}</div></div>
  <div class="g c3"><div class="card"><h3>Tenant growth <span class="note">cumulative, 12 months</span></h3>${lineChart(months.map(m=>m.toLocaleDateString(undefined,{month:'short'})),[{name:'Tenants',data:growth,color:'#0891b2'}],{h:200})}</div>
  <div class="card"><h3>Tenant status distribution</h3>${donut(st,stv,{colors:['#16a34a','#f59e0b','#dc2626'],center:'tenants',click:i=>`App.go('tenants',{f:{status:'${st[i]}'}})`})}</div>
  <div class="card"><h3>Integration health</h3>${donut(ih,ihv,{colors:['#16a34a','#f59e0b','#94a3b8','#475569'],center:'connections',click:i=>`App.go('integrations',{tab:'conn',spec:'integrations'})`})}</div></div>
  <div class="g c3"><div class="card"><h3>Bundle adoption <span class="note">tenants per bundle</span></h3>${barChart(bl,bv,{colors:PAL,h:200,click:i=>`App.go('tenants',{f:{bundleId:'${DB.bundles[i].id}'}})`})}</div>
  <div class="card"><h3>Module adoption <span class="note">enabled assignments</span></h3>${barChart(MODS.map(m=>m[1]),mv,{horizontal:1,click:i=>`App.go('subscriptions',{tab:'ent',spec:'assign',f:{module:'${MODS[i][0]}',en:'Enabled'}})`})}</div>
  <div class="card"><h3>Provisioning activity <span class="note">tasks updated, last ${R}d</span></h3>${barChart(ps,psv,{colors:['#16a34a','#f59e0b','#2563eb','#dc2626','#b91c1c','#94a3b8'],h:200,click:i=>`App.go('provisioning',{f:{status:'${ps[i]}'}})`})}</div></div>
  <div class="g c2" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)"><div class="card"><h3>Operations queue <span class="note">open provisioning tasks</span></h3>${crudHTML('ops')}</div>
  <div class="card"><h3>Recent activity <a href="#" onclick="event.preventDefault();App.go('audit')" style="font-size:12px;color:var(--pri);font-weight:500">View audit log</a></h3><div class="feed">${feed.length?feed.map(a=>`<div><span>${ic(a.portal==='Provider'?'shield':'user')}</span><span><b>${esc(a.action)}</b> · ${esc(a.target)}<br><span class="note" style="margin:0">${esc(a.actor)}</span></span><small>${ago(a.ts)}</small></div>`).join(''):emptyHTML('No activity','Nothing recorded for this tenant yet.')}</div></div></div>`},{spec:'ops'});
PAGES.customers=Pg('Customers','Customers & Organizations','building',()=>{const o=DB.orgs;return ph('Customers & Organizations','Customer organizations that own one or more TIPS tenants')+`<div class="g k4">${kpi('Organizations',o.length,'',"App.go('customers',{})")}${['Strategic','Premium','Standard'].map(t=>kpi(t+' tier',o.filter(x=>x.tier===t).length,'Click to filter',`App.go('customers',{f:{tier:'${t}'}})`)).join('')}</div><div class="card">${crudHTML('orgs')}</div>`},{spec:'orgs'});

PAGES.products=Pg('Commercial','Product Catalog','box',crudPage('Product Catalog','Sellable TIPS modules. Module codes drive entitlements and customer portal access.','products'),{spec:'products'});
PAGES.bundles=Pg('Commercial','Bundles & Packaging','tag',()=>ph('Bundles & Commercial Packaging','Changing a bundle’s modules re-syncs entitlements for every tenant on that bundle')+`<div class="g k4">${DB.bundles.map(b=>kpi(b.name,'$'+num(b.price),`${b.modules.length} modules · ${DB.tenants.filter(t=>t.bundleId===b.id).length} tenants · ${b.status}`,`App.go('tenants',{f:{bundleId:'${b.id}'}})`)).join('')}</div><div class="card">${crudHTML('bundles')}</div>`,{spec:'bundles'});

PAGES.provisioning=Pg('Commercial','Module Provisioning','cpu',()=>{const T=scopedRows(SPECS.tasks);return ph('Module Provisioning','Provisioning pipeline for tenants and modules. Executions are simulated.',ptSel())+`<div class="g k4">${['Queued','Failed','Blocked','Completed'].map(s=>kpi(s,T.filter(t=>t.status===s).length,'Click to filter',`App.go('provisioning',{f:{status:'${s}'}})`,s==='Failed'||s==='Blocked'?(T.some(t=>t.status===s)?'bad':''):'')).join('')}</div><div class="card">${crudHTML('tasks')}</div>`},{spec:'tasks'});
PAGES.exams=Pg('Platform configuration','Exam Programs','book',()=>ph('Exam Programs','Exam programs across tenants. Use the tenant filter to scope.',ptSel())+`<div class="card">${crudHTML('examsP')}</div>`,{spec:'examsP'});
PAGES.config=Pg('Platform configuration','Global Configuration','gear',()=>{const C=DB.config;const F=[{k:'platformName',l:'Platform display name',req:1,maxLen:60},{k:'supportEmail',l:'Support email',t:'email',req:1},{k:'defaultRegion',l:'Default data region',t:'select',opts:REGIONS,req:1},{k:'sessionTimeout',l:'Session timeout (minutes)',t:'number',min:5,max:240,req:1},{k:'passwordMinLength',l:'Minimum password length',t:'number',min:8,max:64,req:1},{k:'apiRateLimit',l:'API rate limit (requests / minute / tenant)',t:'number',min:60,max:100000,req:1},{k:'dataRetentionDays',l:'Default data retention (days)',t:'number',min:30,max:3650,req:1},{k:'auditRetentionDays',l:'Audit log retention (days)',t:'number',min:365,max:3650,req:1,check:(v,vals)=>v<vals.dataRetentionDays?'Audit retention must be ≥ data retention':''},{k:'mfaRequired',l:'Require MFA for all operators',t:'bool'},{k:'maintenanceMode',l:'Maintenance mode (simulated)',t:'bool',hint:'Shows a maintenance banner across both portals'}];
  setTimeout(()=>{CFG.global.confirm=v=>v.maintenanceMode&&!DB.config.maintenanceMode?['Enable maintenance mode?','A maintenance banner will appear for all users of this demo.']:null},0);
  return ph('Global Configuration','Platform-wide defaults applied to new tenants')+`<div class="card">${cfgForm('global',F,C,v=>{const ch=Object.keys(v).filter(k=>v[k]!==C[k]);Object.assign(C,v);log('Updated global configuration',ch.join(', ')||'no changes');return ch.length?`Saved ${ch.length} setting(s)`:'No changes to save'})}</div>`});
PAGES.schema=Pg('Platform configuration','Field & Schema Registry','db',crudPage('Field & Schema Registry','Canonical data fields shared by APIs, rules and reports. PII fields are encrypted and masked.','fields'),{spec:'fields'});

PAGES.workflow=Pg('Platform configuration','Workflow & Actions','flow',crudPage('Workflow & Actions','Automations triggered by risk and case events. Test runs are dry-run simulations.','workflows'),{spec:'workflows'});
PAGES.integrations=Pg('Operations','Integrations & API','plug',()=>{const[cur,t]=tabs('integrations',[['conn','Connections'],['keys','Provider API keys']]);return ph('Integrations & API Management','Third-party connections and provider API credentials · all checks are simulated')+t+`<div class="card">${crudHTML(cur==='conn'?'integrations':'pkeys')}</div>`},{spec:'integrations'});
PAGES.users=Pg('Operations','Users & Permissions','users',()=>{const[cur,t]=tabs('users',[['u','Platform users'],['r','Roles & permissions']]);if(cur==='u')return ph('Users & Permissions','Provider-side operator accounts')+t+`<div class="card">${crudHTML('pusers')}</div>`;
  const P=[['tenants','Manage tenants'],['bundles','Manage bundles & products'],['provisioning','Run provisioning'],['config','Global configuration'],['integrations','Integrations & keys'],['users','Manage users'],['audit','View audit logs'],['incidents','Manage incidents']];
  return ph('Users & Permissions','Role-based access for provider operators')+t+`<div class="card"><form onsubmit="event.preventDefault();App.saveRoles(this.querySelector('.btn.pri'))"><div class="tw"><table class="matrix"><thead><tr><th class="ns">Permission</th>${DB.roles.map(r=>`<th class="ns">${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${P.map(([k,l])=>`<tr style="cursor:default"><td>${esc(l)}</td>${DB.roles.map((r,i)=>`<td><input type="checkbox" data-r="${i}" data-p="${k}" ${r.perms.includes(k)?'checked':''} ${r.name==='Platform Admin'?'disabled title="Platform Admin always has all permissions"':''} aria-label="${esc(r.name+' '+l)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="fl" style="justify-content:flex-end;margin-top:12px"><span class="note">Platform Admin is locked to full access.</span><button type="button" class="btn" onclick="App.rerender()">Discard</button><button class="btn pri">Save permissions</button></div></form></div>`},{spec:'pusers'});
PAGES.audit=Pg('Operations','Audit & Compliance','shield',()=>{const A=scopedRows(SPECS.audit),d=Date.now()-DAY;return ph('Audit & Compliance','Immutable record of operator and customer actions (demo store, capped at 800 events)',ptSel())+`<div class="g k4">${kpi('Events (total)',A.length,'',"App.go('audit',{})")}${kpi('Last 24 hours',A.filter(a=>new Date(a.ts)>=d).length,'')}${kpi('Provider actions',A.filter(a=>a.portal==='Provider').length,'Click to filter',"App.go('audit',{f:{portal:'Provider'}})")}${kpi('Customer actions',A.filter(a=>a.portal==='Customer').length,'Click to filter',"App.go('audit',{f:{portal:'Customer'}})")}</div><div class="card">${crudHTML('audit')}</div>`},{spec:'audit'});
PAGES.health=Pg('Operations','Service Health & Incidents','activity',()=>`${ph('Service Health & Incidents','Status of platform services (simulated) and incident management')}<div class="g c2" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><div class="card"><h3>Services</h3>${crudHTML('services')}</div><div class="card"><h3>Incidents</h3>${crudHTML('incidents')}</div></div>`,{spec:'incidents'});
PAGES.usage=Pg('Operations','Usage & Entitlements','chart',()=>{const R=UI.range,rows=scopedRows(SPECS.usage),top=[...rows].sort((a,b)=>b.used-a.used).slice(0,10);const tids=scopeTenants().map(t=>t.id);
  return ph('Usage & Entitlements','Consumption against licensed seats for the selected period',rangeSel()+ptSel())+`<div class="g k4">${kpi('Verifications',kfmt(sum(rows.map(r=>r.used))),'Selected period')}${kpi('API requests',kfmt(sum(rows.map(r=>r.api))),'Selected period')}${kpi('Over quota',rows.filter(r=>r.state==='Over quota').length,'Tenants',"App.go('usage',{f:{state:'Over quota'}})",'bad')}${kpi('Near limit (≥85%)',rows.filter(r=>r.state==='Near limit').length,'Tenants',"App.go('usage',{f:{state:'Near limit'}})",'warn')}</div>
  <div class="g c2"><div class="card"><h3>Top tenants by verifications</h3>${barChart(top.map(r=>r.name),top.map(r=>r.used),{horizontal:1})}</div><div class="card"><h3>Daily API requests</h3>${lineChart(dayLabels(R),[{name:'API requests',data:seriesFor(tids,R,true),color:'#7c3aed'},{name:'Verifications',data:seriesFor(tids,R),color:'#2563eb'}])}</div></div><div class="card">${crudHTML('usage')}</div>`},{spec:'usage'});

const ct=()=>byId('tenants',UI.ctenant);
PAGES['c-overview']=Pg('Home','Customer Overview','grid',()=>{const t=ct();if(!t)return emptyHTML('No tenant selected');const T=t.id,R=UI.range,b=byId('bundles',t.bundleId);
  const V=DB.ver.filter(v=>v.tenantId===T),pass=V.length?Math.round(V.filter(v=>v.status==='Verified').length/V.length*100):0;const A=DB.alerts.filter(a=>a.tenantId===T),C=DB.cases.filter(c=>c.tenantId===T);
  const lockK=(l,m)=>kpi(l,ic('lock'),'Not in subscription',`App.go('c-products')`);
  const sev=['Low','Medium','High','Critical'],cs=['Open','In Review','Escalated','Closed'];
  return ph(`Welcome, ${t.name}`,`${b?b.name:''} bundle · ${t.region} · ${UI.role} view`,rangeSel())+`<div class="g k4">${hasMod(T,'idv')?kpi(`Verifications (${R}d)`,kfmt(sum(seriesFor([T],R))),`${pass}% pass rate (recent sample)`,"App.go('c-idv')"):lockK('Verifications','idv')}${hasMod(T,'events')?kpi('Open alerts',A.filter(a=>['New','Acknowledged'].includes(a.status)).length,'New + acknowledged',"App.go('c-events',{f:{status:'New'}})",'warn'):lockK('Open alerts')}${hasMod(T,'cases')?kpi('Open cases',C.filter(c=>c.status!=='Closed').length,`${C.filter(c=>c.status!=='Closed'&&new Date(c.due)<Date.now()).length} past SLA`,"App.go('c-cases',{f:{status:'Open'}})"):lockK('Open cases')}${hasMod(T,'workflow')?kpi('Pending approvals',DB.approvals.filter(a=>a.tenantId===T&&a.status==='Pending').length,'Awaiting decision',"App.go('c-workflow',{f:{status:'Pending'}})"):lockK('Pending approvals')}${kpi('Exam programs',DB.exams.filter(e=>e.tenantId===T&&e.status!=='Completed').length,'Active or upcoming',"App.go('c-exams')")}${kpi('Subscribed modules',DB.assign.filter(a=>a.tenantId===T&&a.enabled).length+' / '+MODS.length,'View products',"App.go('c-products')")}</div>
  <div class="g c2"><div class="card"><h3>Verification volume <span class="note">last ${R} days</span></h3>${hasMod(T,'idv')?lineChart(dayLabels(R),[{name:'Verifications',data:seriesFor([T],R)}],{area:1}):emptyHTML('Identity Verification not subscribed')}</div>
  <div class="card"><h3>Alerts by severity</h3>${hasMod(T,'events')?donut(sev,sev.map(s=>A.filter(a=>a.severity===s).length),{colors:['#2563eb','#f59e0b','#dc2626','#7f1d1d'],center:'alerts',click:i=>`App.go('c-events',{f:{severity:'${sev[i]}'}})`}):emptyHTML('Events & Alerts not subscribed')}</div></div>
  <div class="g c2"><div class="card"><h3>Cases by status</h3>${hasMod(T,'cases')?barChart(cs,cs.map(s=>C.filter(c=>c.status===s).length),{colors:['#2563eb','#f59e0b','#dc2626','#16a34a'],h:190,click:i=>`App.go('c-cases',{f:{status:'${cs[i]}'}})`}):emptyHTML('Cases not subscribed')}</div>
  <div class="card"><h3>Recent activity in your tenant</h3><div class="feed">${DB.audit.filter(a=>a.tenantId===T).slice(0,6).map(a=>`<div><span><b>${esc(a.action)}</b> · ${esc(a.target)}<br><span class="note" style="margin:0">${esc(a.actor)}</span></span><small>${ago(a.ts)}</small></div>`).join('')||emptyHTML('No activity yet')}</div></div></div>`});
PAGES['c-products']=Pg('Home','My Products','box',()=>{const t=ct(),b=byId('bundles',t.bundleId),s=DB.subs.find(s=>s.tenantId===t.id);
  return ph('My Products',`Bundle: ${b?b.name:'—'} · Renewal ${s?fmtD(s.end):'—'} · ${num(t.seats)} seats`)+`<div class="mods">${MODS.map(([c,n,d])=>{const a=DB.assign.find(a=>a.tenantId===t.id&&a.module===c),on=hasMod(t.id,c),req=DB.tickets.some(k=>k.tenantId===t.id&&k.subject===`Upgrade request: ${n}`&&k.status!=='Resolved');const pg=Object.keys(PAGES).find(k=>PAGES[k].mod===c);

PAGES['c-idv']=Pg('Integrity','Identity Verification','id',()=>{const V=scopedRows(SPECS.cver);return ph('Identity Verification','Document and biometric checks for candidates · checks are simulated')+`<div class="g k4">${['Verified','Manual review','Pending','Rejected'].map(s=>kpi(s,V.filter(v=>v.status===s).length,'Click to filter',`App.go('c-idv',{f:{status:'${s}'}})`,s==='Rejected'?'bad':s==='Manual review'?'warn':'')).join('')}</div><div class="card">${crudHTML('cver')}</div>`},{mod:'idv',spec:'cver'});

PAGES['c-cases']=Pg('Integrity','Cases & Investigations','folder',crudPage('Cases & Investigations','Investigation queue with SLA tracking','ccases'),{mod:'cases',spec:'ccases'});
PAGES['c-evidence']=Pg('Integrity','Evidence','file',crudPage('Evidence','Tamper-evident evidence register. Uploads are simulated (metadata only).','cevidence'),{mod:'evidence',spec:'cevidence'});
PAGES['c-workflow']=Pg('Integrity','Workflow & Approvals','flow',()=>{const[cur,t]=tabs('c-workflow',[['a','Approvals'],['w','Active workflows']]);return ph('Workflow & Approvals','Decisions that require sign-off')+t+`<div class="card">${crudHTML(cur==='a'?'capprovals':'cwf')}</div>`},{mod:'workflow',spec:'capprovals'});
PAGES['c-analytics']=Pg('Insights','Analytics & Reports','chart',()=>{const T=UI.ctenant,R=UI.range,V=DB.ver.filter(v=>v.tenantId===T),A=DB.alerts.filter(a=>a.tenantId===T),C=DB.cases.filter(c=>c.tenantId===T),vs=['Verified','Manual review','Pending','Rejected'],sv=['Low','Medium','High','Critical'],cs=['Open','In Review','Escalated','Closed'];
  return ph('Analytics & Reports','Trends for your tenant and downloadable reports',rangeSel())+`<div class="g c2"><div class="card"><h3>Verification volume <span class="note">last ${R} days</span></h3>${lineChart(dayLabels(R),[{name:'Verifications',data:seriesFor([T],R)}],{area:1})}</div><div class="card"><h3>Verification outcomes <span class="note">recent records</span></h3>${donut(vs,vs.map(s=>V.filter(v=>v.status===s).length),{colors:['#16a34a','#f59e0b','#94a3b8','#dc2626'],center:'checks'})}</div></div>
  <div class="g c2"><div class="card"><h3>Alerts by severity</h3>${barChart(sv,sv.map(s=>A.filter(a=>a.severity===s).length),{colors:['#2563eb','#f59e0b','#dc2626','#7f1d1d'],h:180})}</div><div class="card"><h3>Cases by status</h3>${barChart(cs,cs.map(s=>C.filter(c=>c.status===s).length),{colors:['#2563eb','#f59e0b','#dc2626','#16a34a'],h:180})}</div></div><div class="card"><h3>Reports</h3>${crudHTML('creports')}</div>`},{mod:'analytics',spec:'creports'});
PAGES['c-api']=Pg('Insights','Integrations & API','plug',()=>{const[cur,t]=tabs('c-api',[['k','API keys'],['w','Webhooks']]);return ph('Integrations & API','Credentials and event subscriptions for your systems · deliveries are simulated')+t+`<div class="card">${crudHTML(cur==='k'?'ckeys':'chooks')}</div>`},{mod:'api',spec:'ckeys'});
PAGES['c-exams']=Pg('Administration','Exam Programs','book',crudPage('Exam Programs','Your exam programs and delivery windows','cexams'),{spec:'cexams'});
PAGES['c-config']=Pg('Administration','Configuration','gear',()=>{const t=ct(),C=DB.tconfig[t.id]||(DB.tconfig[t.id]={});const p=can({area:'config'});
  const F=[{k:'timezone',l:'Tenant timezone',t:'select',opts:['America/New_York','America/Los_Angeles','Europe/London','Europe/Berlin','Asia/Kolkata','Asia/Singapore','Australia/Sydney'],req:1},{k:'notifyEmail',l:'Alert notification email',t:'email',req:1},{k:'riskThreshold',l:'Auto-case risk threshold (1–100)',t:'number',min:1,max:100,req:1},{k:'retentionDays',l:'Candidate data retention (days)',t:'number',min:30,max:DB.config.dataRetentionDays,req:1,hint:`Platform maximum: ${DB.config.dataRetentionDays} days`},{k:'autoCase',l:'Automatically open cases above threshold',t:'bool'},{k:'mfaRequired',l:'Require MFA for tenant users',t:'bool'},{k:'candidateConsentText',l:'Candidate consent text',t:'textarea',req:1,maxLen:500}];
  return ph('Configuration','Tenant-level settings')+`<div class="card">${cfgForm('tenant',F,C,v=>{const ch=Object.keys(v).filter(k=>v[k]!==C[k]);Object.assign(C,v);log('Updated tenant configuration',ch.join(', ')||'no changes',t.id);return ch.length?`Saved ${ch.length} setting(s)`:'No changes to save'},p===true?null:p)}</div>`});
PAGES['c-users']=Pg('Administration','Users & Roles','users',()=>ph('Users & Roles','People in your tenant. Use the user menu (top right) to preview each role.')+`<div class="g k4">${Object.entries({'Customer Admin':'Full access incl. configuration, users, approvals','Analyst':'Operate IDV, alerts, cases, evidence; no admin','Viewer':'Read-only access to subscribed modules'}).map(([r,d])=>kpi(r,DB.users.filter(u=>u.tenantId===UI.ctenant&&u.role===r).length,d,`App.go('c-users',{f:{role:'${r}'}})`)).join('')}</div><div class="card">${crudHTML('cusers')}</div>`,{spec:'cusers'});
PAGES['c-audit']=Pg('Administration','Audit Logs','shield',crudPage('Audit Logs','Actions performed in your tenant, including provider actions that affect it','caudit'),{spec:'caudit'});
PAGES['c-support']=Pg('Administration','Support & Service Health','help',()=>{const inc=DB.incidents.filter(i=>i.status!=='Resolved');return ph('Support & Service Health','Platform status and your support tickets')+`<div class="g c2" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><div class="card"><h3>Service status</h3>${DB.services.map(s=>`<div class="svc"><span>${esc(s.name)}</span>${badge(s.status)}</div>`).join('')}${inc.length?`<h3 style="margin-top:14px">Active incidents</h3>${inc.map(i=>`<div class="svc" style="display:block"><b>${esc(i.title)}</b> ${badge(i.status)}<div class="note">${esc(i.update)} · started ${ago(i.started)}</div></div>`).join('')}`:'<p class="note">No active incidents.</p>'}</div><div class="card"><h3>Support tickets</h3>${crudHTML('ctickets')}</div></div>`},{spec:'ctickets'});

/* ---- extra controller actions ---- */
Object.assign(App,{
  async flagToggle(id,el){const f=DB.flags.find(x=>x.id===id);if(!f)return;el.disabled=true;await sleep(250);f.enabled=el.checked;log(`Feature flag ${f.enabled?'on':'off'}`,f.key);if(save()){toast(`${f.key} turned ${f.enabled?'on':'off'}`,'ok')}else{f.enabled=!el.checked;el.checked=f.enabled}el.disabled=false;refreshTable('flags')},
  async addNote(id,btn){const c=DB.cases.find(x=>x.id===id&&x.tenantId===UI.ctenant);const v=$('#f_note').value.trim();if(!v){$('#w_note').classList.add('bad');$('#e_note').textContent='Enter a note';return}if(v.length>1000){$('#e_note').textContent='Maximum 1000 characters';return}
    await busy(btn,()=>{(c.notes=c.notes||[]).push({by:actor(),ts:nowISO(),text:v});log('Added case note',c.id,c.tenantId);if(save()){closeModal();rerender();toast('Note added to '+c.id,'ok')}})},
  async saveRoles(btn){await busy(btn,()=>{const boxes=[...document.querySelectorAll('.matrix input[data-r]')];DB.roles.forEach((r,i)=>{if(r.name==='Platform Admin')return;r.perms=boxes.filter(b=>+b.dataset.r===i&&b.checked).map(b=>b.dataset.p)});log('Updated role permissions','Roles');if(save()){rerender();toast('Permissions saved','ok')}})}
});

load();
if(!byId('tenants',UI.ctenant))UI.ctenant=DB.tenants[0]&&DB.tenants[0].id;
if(UI.ptenant!=='all'&&!byId('tenants',UI.ptenant))UI.ptenant='all';
render(true);

<script>
(function(){
'use strict';
Object.assign(ICONS,{sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",moon:"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z",chat:"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",send:"M22 2 11 13M22 2l-7 20-4-9-9-4z",trash:"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"});

/* ---------- theme ---------- */
const TK='tips_theme';
const curTheme=()=>document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
function setTheme(t,quiet){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(TK,t)}catch(e){}window.themeIcon();if(!quiet)toast(t==='dark'?'Dark mode on':'Light mode on','ok')}
window.themeIcon=function(){const b=document.getElementById('theme');if(!b)return;const d=curTheme()==='dark';b.innerHTML=ic(d?'sun':'moon');b.title=d?'Switch to light mode':'Switch to dark mode';b.setAttribute('aria-label',b.title)};
App.theme=function(){setTheme(curTheme()==='dark'?'light':'dark')};

/* ---------- assistant ---------- */
const BK='tips_chat_v1';
let msgs=[],isOpen=false,typing=false,hist=[],hi=0;
try{msgs=JSON.parse(localStorage.getItem(BK))||[]}catch(e){msgs=[]}
const store=()=>{try{localStorage.setItem(BK,JSON.stringify(msgs.slice(-60)))}catch(e){}};
const $b=id=>document.getElementById(id);
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const R=(t,a)=>({t,a:a||[]});
const go=(l,go,p)=>({l,go,p});
const list=(a,n=5)=>a.slice(0,n).map(x=>'• '+x).join('\n')+(a.length>n?`\n…and ${a.length-n} more`:'');
const cnt=(a,k,v)=>a.filter(x=>x[k]===v).length;
const isCust=()=>UI.portal==='customer';

const CHIPS={provider:['Platform summary','Failed provisioning','Active incidents','Over-quota tenants','Support tickets','Bundles'],customer:['My open cases','Overdue cases','Pending approvals','My modules','Alerts summary','Create a ticket']};
const STOP=['the','page','tab','my','all','and','for'];
function matchPage(txt){
  const ws=txt.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).map(w=>w.replace(/s$/,'')).filter(w=>w.length>2&&!STOP.includes(w));
  if(!ws.length)return null;let best=null;
  navList().forEach(([k,p])=>{const t=p.t.toLowerCase();if(ws.every(w=>t.includes(w))&&(!best||p.t.length<best[1].t.length))best=[k,p]});
  return best;
}
function modByText(q){const K={idv:/identity|verif|idv/,risk:/risk|rule/,events:/event|alert/,cases:/case|investigation/,evidence:/evidence/,workflow:/workflow|approval/,analytics:/analytic|report/,api:/\bapi\b|integration/};return MODS.find(m=>K[m[0]].test(q))||null}
function need(mod){
  if(hasMod(UI.ctenant,mod))return null;const t=byId('tenants',UI.ctenant);
  if(t&&t.status!=='Active')return R(`Your tenant is **${t.status}**, so **${modName(mod)}** is unavailable right now.`,[go('My products','c-products')]);
  const pend=DB.assign.some(a=>a.tenantId===UI.ctenant&&a.module===mod&&!a.enabled);
  if(pend)return R(`**${modName(mod)}** is assigned to your tenant but hasn't been activated by the provider yet.`,[go('My products','c-products')]);
  const a=[go('My products','c-products')];if(UI.role==='Customer Admin')a.push({l:'Request upgrade',fn:'upgrade',arg:mod});
  return R(`**${modName(mod)}** isn't part of your current bundle, so I can't show that data.`,a);
}
function incidentsText(){
  const inc=DB.incidents.filter(i=>i.status!=='Resolved'),sv=DB.services.filter(s=>s.status!=='Operational');
  let t=inc.length?`**${inc.length} open incident(s)**\n`+list(inc.map(i=>`${i.id} — ${i.title} (${i.severity}, ${i.status}): ${i.update}`),4):'No open incidents.';
  t+='\n'+(sv.length?`\n**Services not fully operational:** ${sv.map(s=>s.name+' ('+s.status+')').join(', ')}`:'\nAll services are operational.');
  return t;
}
function describeId(m){
  const id=m[0].toUpperCase(),pre=id.split('-')[0];
  const C={TEN:'tenants',CASE:'cases',TCK:'tickets',INC:'incidents',EVD:'evidence',APR:'approvals',VER:'ver',ALR:'alerts',USR:'users',SUB:'subs',PRV:'tasks'};
  const r=DB[C[pre]].find(x=>x.id===id);
  if(!r)return R(`I couldn't find **${id}** in the demo data.`);
  if(isCust()&&pre!=='INC'&&(pre==='TEN'?r.id:r.tenantId)!==UI.ctenant)return R(`**${id}** isn't part of your tenant, so I can't show it.`);
  const T=r.tenantId?` · ${tName(r.tenantId)}`:'';
  switch(pre){
    case'TEN':return R(`**${r.name}** (${id}) — ${r.status}\nRegion ${r.region} · bundle ${bName(r.bundleId)} · ${num(r.seats)} seats`,isCust()?[]:[go('Open tenant','tenants',{q:id})]);
    case'CASE':return R(`**${r.title}** (${id})\n${r.type} · ${r.priority} priority · ${r.status}\nAssignee: ${r.assignee||'Unassigned'} · SLA due ${fmtD(r.due)}${r.status!=='Closed'&&new Date(r.due)<Date.now()?' (**overdue**)':''}\n${r.summary||''}`,isCust()?[go('Open cases','c-cases',{q:id})]:[]);
    case'TCK':return R(`**${r.subject}** (${id})${T}\n${r.priority} priority · ${r.status} · ${r.assignee||'Unassigned'}`,[isCust()?go('Open support','c-support',{q:id}):go('Open support','support',{q:id})]);
    case'INC':return R(`**${r.title}** (${id})\n${r.severity} · ${r.status} · ${r.service}\n${r.update}`,isCust()?[go('Status page','c-support')]:[go('Open incidents','health')]);
    default:return R(`**${id}**${T}\n`+Object.entries(r).filter(([k,v])=>['status','name','type','task','request','severity','rule','candidate'].includes(k)&&v).map(([k,v])=>`${k}: ${v}`).join('\n'));
  }
}
function tenantCard(t){
  const mods=DB.assign.filter(a=>a.tenantId===t.id&&a.enabled).map(a=>modName(a.module));
  const bad=DB.tasks.filter(x=>x.tenantId===t.id&&['Failed','Blocked'].includes(x.status));
  const tk=DB.tickets.filter(x=>x.tenantId===t.id&&x.status!=='Resolved');
  const u=usageRows().find(r=>r.id===t.id);
  let s=`**${t.name}** (${t.id}) — ${t.status}\n${oName(t.orgId)} · ${t.region} · ${bName(t.bundleId)} bundle · ${num(t.seats)} seats\nModules: ${mods.length?mods.join(', '):'none enabled'}`;
  if(u&&u.used)s+=`\nUsage (${UI.range}d): ${num(u.used)} verifications, ${u.util}% of entitlement (${u.state})`;
  if(bad.length)s+=`\n**Provisioning issues:**\n`+list(bad.map(b=>`${b.task} (${b.status}): ${b.message}`),3);
  if(tk.length)s+=`\n${tk.length} open ticket(s): ${tk.slice(0,2).map(x=>x.subject).join('; ')}`;
  const a=[go('Open tenant','tenants',{q:t.id})];if(bad.length)a.push(go('Provisioning','provisioning',{q:t.id}));a.push({l:'View as customer',fn:'asCustomer',arg:t.id});
  return R(s,a);
}

/* ---- provider answers ---- */
function provider(q){
  const K=provKPI();
  const hit=DB.tenants.find(t=>{const w=t.name.toLowerCase().split(/\s+/)[0];return w.length>3&&new RegExp('\\b'+w+'\\b').test(q)});
  if(hit)return tenantCard(hit);
  if(/^(summary|overview)|platform (summary|status|overview)|how('?s| is) the platform|kpi/.test(q)){
    const op=DB.tickets.filter(t=>t.status!=='Resolved').length;
    return R(`**Platform summary**\n• ${K.tenants} tenants — ${K.active} active, ${K.prov} provisioning, ${K.susp} suspended\n• ${K.attn} provisioning task(s) failed or blocked\n• ${K.degraded} degraded integration(s), ${K.inc} open incident(s)\n• ${op} open support ticket(s)`,[go('Open overview','overview'),...(K.attn?[go('Failed tasks','provisioning',{f:{attn:'Needs attention'}})]:[])]);
  }
  if(/fail|block|stuck|attention|error|retry/.test(q)||/provisioning task|task/.test(q)){
    const T=DB.tasks.filter(t=>['Failed','Blocked'].includes(t.status)&&(UI.ptenant==='all'||t.tenantId===UI.ptenant));
    if(!T.length)return R('No failed or blocked provisioning tasks right now.',[go('Open provisioning','provisioning')]);
    return R(`**${T.length} provisioning task(s) need attention**\n`+list(T.map(t=>`${tName(t.tenantId)} — ${t.task} (${t.status}): ${t.message||'no message'}`)),[go('Open provisioning','provisioning',{f:{attn:'Needs attention'}})]);
  }
  if(/suspend/.test(q)){const S=DB.tenants.filter(t=>t.status==='Suspended');return R(S.length?`**${S.length} suspended tenant(s)**\n`+list(S.map(t=>`${t.name} (${t.region})`)):'No tenants are suspended.',[go('View suspended','tenants',{f:{status:'Suspended'}})])}
  if(/provision/.test(q)){const P=DB.tenants.filter(t=>t.status==='Provisioning');return R(P.length?`**${P.length} tenant(s) awaiting provisioning**\n`+list(P.map(t=>{const ts=DB.tasks.filter(x=>x.tenantId===t.id);return `${t.name} — ${cnt(ts,'status','Completed')}/${ts.length} tasks done`})):'No tenants are waiting for provisioning.',[go('View provisioning','tenants',{f:{status:'Provisioning'}})])}
  if(/incident|outage|downtime|service|health/.test(q)&&!/integration/.test(q))return R(incidentsText(),[go('Open incidents','health')]);
  if(/integration|connection|splunk|twilio|okta|webhook/.test(q)){const I=DB.integrations,d=I.filter(i=>i.enabled&&i.status==='Degraded');return R(`**${I.length} integrations** — ${I.filter(i=>i.enabled&&i.status==='Healthy').length} healthy, ${d.length} degraded\n`+(d.length?list(d.map(i=>`${i.name} — ${num(i.latency)} ms`)):'Nothing degraded.'),[go('Open integrations','integrations',{tab:'conn',spec:'integrations'})])}
  if(/usage|quota|seat|over limit|consumption|verification|volume/.test(q)){const rows=usageRows(),over=rows.filter(r=>r.state==='Over quota'),near=rows.filter(r=>r.state==='Near limit');
    return R(`**Usage — last ${UI.range} days**\n${num(sum(rows.map(r=>r.used)))} verifications across ${rows.length} tenants\n`+(over.length?`**Over quota (${over.length}):**\n${list(over.map(r=>`${r.name} — ${r.util}%`))}\n`:'No tenants over quota.\n')+(near.length?`Near limit (${near.length}): ${near.slice(0,4).map(r=>r.name).join(', ')}`:''),[go('Open usage','usage',over.length?{f:{state:'Over quota'}}:{})])}
  if(/ticket|support|upgrade request/.test(q)){const o=DB.tickets.filter(t=>t.status!=='Resolved'),un=o.filter(t=>!t.assignee);
    return R(`**${o.length} open ticket(s)**, ${un.length} unassigned\n`+list(o.map(t=>`${t.id} — ${tName(t.tenantId)}: ${t.subject} (${t.priority})`),4),[go('Open support','support',{f:{status:'Open'}})])}
  if(/bundle|package|pricing|price|product|module/.test(q))return R('**Bundles**\n'+DB.bundles.map(b=>`• ${b.name} — $${num(b.price)}/mo, ${DB.tenants.filter(t=>t.bundleId===b.id).length} tenants\n   ${b.modules.map(modName).join(', ')}`).join('\n'),[go('Bundles','bundles'),go('Product catalog','products')]);
  if(/audit|recent activity|who changed|log/.test(q))return R('**Latest audit events**\n'+list(DB.audit.slice(0,5).map(a=>`${a.action} — ${a.target} (${ago(a.ts)}, ${a.actor})`)),[go('Open audit','audit')]);
  if(/user|operator|admin|role|permission/.test(q)){const U=DB.users.filter(u=>!u.tenantId);return R(`**${U.length} platform users**\n`+DB.roles.map(r=>`• ${r.name}: ${cnt(U,'role',r.name)}`).join('\n')+`\n${cnt(U,'status','Disabled')} disabled`,[go('Users & permissions','users')])}
  if(/flag|feature|rollout/.test(q))return R('**Feature flags**\n'+list(DB.flags.map(f=>`${f.key} — ${f.enabled?'on':'off'}, ${f.rollout}% rollout`),8),[go('Feature flags','flags')]);
  if(/api key|keys/.test(q)){const k=DB.pkeys;return R(`**${k.length} provider API keys**\n`+list(k.map(x=>`${x.name} (${x.prefix}…) — ${x.status}`)),[go('Open API keys','integrations',{tab:'keys',spec:'pkeys'})])}
  if(/organi[sz]ation|customer|tier/.test(q)){const o=DB.orgs;return R(`**${o.length} customer organizations**\nStrategic ${cnt(o,'tier','Strategic')} · Premium ${cnt(o,'tier','Premium')} · Standard ${cnt(o,'tier','Standard')}`,[go('Open customers','customers')])}
  if(/tenant/.test(q))return R(`**${K.tenants} tenants** — ${K.active} active, ${K.prov} provisioning, ${K.susp} suspended`,[go('Open tenants','tenants')]);
  return null;
}
/* ---- customer answers ---- */
function customer(q){
  const T=UI.ctenant,t=byId('tenants',T);if(!t)return R('No tenant is selected.');
  let g;
  if(/^(summary|overview|dashboard)|how are we|tenant summary/.test(q)){
    const C=DB.cases.filter(c=>c.tenantId===T&&c.status!=='Closed'),A=DB.alerts.filter(a=>a.tenantId===T&&['New','Acknowledged'].includes(a.status));
    return R(`**${t.name}** — ${t.status}\nBundle: ${bName(t.bundleId)} · ${DB.assign.filter(a=>a.tenantId===T&&a.enabled).length}/${MODS.length} modules active`+(hasMod(T,'cases')?`\n${C.length} open cases (${C.filter(c=>new Date(c.due)<Date.now()).length} past SLA)`:'')+(hasMod(T,'events')?`\n${A.length} open alerts`:'')+(hasMod(T,'workflow')?`\n${cnt(DB.approvals.filter(a=>a.tenantId===T),'status','Pending')} pending approvals`:''),[go('Open overview','c-overview')]);
  }
  if(/module|product|plan|subscription|bundle|upgrade/.test(q)){
    const on=MODS.filter(m=>hasMod(T,m[0])),off=MODS.filter(m=>!hasMod(T,m[0]));
    return R(`**Plan: ${bName(t.bundleId)}** (${t.status})\nActive (${on.length}): ${on.map(m=>m[1]).join(', ')||'none'}\nNot active (${off.length}): ${off.map(m=>m[1]).join(', ')||'none'}`+(off.length&&UI.role==='Customer Admin'?'\nSay "request upgrade evidence" (for example) to ask for a module.':''),[go('My products','c-products')]);
  }
  if(/case|investigation|sla|overdue|breach/.test(q)){
    if(g=need('cases'))return g;const C=DB.cases.filter(c=>c.tenantId===T),open=C.filter(c=>c.status!=='Closed'),od=open.filter(c=>new Date(c.due)<Date.now());
    if(/overdue|sla|breach|late|past/.test(q))return R(od.length?`**${od.length} case(s) past SLA**\n`+list(od.map(c=>`${c.id} — ${c.title} (${c.priority}, due ${fmtD(c.due)})`)):'No cases are past their SLA.',[go('Open cases','c-cases')]);
    return R(`**${open.length} open case(s)** of ${C.length}\nOpen ${cnt(C,'status','Open')} · In review ${cnt(C,'status','In Review')} · Escalated ${cnt(C,'status','Escalated')} · Closed ${cnt(C,'status','Closed')}\n${od.length} past SLA`,[go('Open cases','c-cases',{f:{status:'Open'}})]);
  }
  if(/alert|event/.test(q)){
    if(g=need('events'))return g;const A=DB.alerts.filter(a=>a.tenantId===T),n=A.filter(a=>a.status==='New'),rank={Critical:0,High:1,Medium:2,Low:3};
    return R(`**${n.length} new alert(s)**, ${cnt(A,'status','Escalated')} escalated\nCritical ${cnt(A,'severity','Critical')} · High ${cnt(A,'severity','High')} · Medium ${cnt(A,'severity','Medium')} · Low ${cnt(A,'severity','Low')}\n`+(n.length?'Top new alerts:\n'+list([...n].sort((a,b)=>rank[a.severity]-rank[b.severity]).map(a=>`${a.rule} — ${a.candidate} (${a.severity}, score ${a.score})`),3):''),[go('Open alerts','c-events',{f:{status:'New'}})]);
  }
  if(/verif|identity|idv|candidate/.test(q)){
    if(g=need('idv'))return g;const V=DB.ver.filter(v=>v.tenantId===T);
    return R(`**${V.length} recent verifications**\nVerified ${cnt(V,'status','Verified')} · Manual review ${cnt(V,'status','Manual review')} · Pending ${cnt(V,'status','Pending')} · Rejected ${cnt(V,'status','Rejected')}\nPass rate ${V.length?Math.round(cnt(V,'status','Verified')/V.length*100):0}%`,[go('Open verifications','c-idv')]);
  }
  if(/evidence|legal hold/.test(q)){
    if(g=need('evidence'))return g;const E=DB.evidence.filter(e=>e.tenantId===T);
    return R(`**${E.length} evidence items** (${E.reduce((a,e)=>a+e.sizeMB,0).toFixed(1)} MB)\n${E.filter(e=>e.legalHold).length} on legal hold`,[go('Open evidence','c-evidence')]);
  }
  if(/approv|sign.?off/.test(q)){
    if(g=need('workflow'))return g;const P=DB.approvals.filter(a=>a.tenantId===T&&a.status==='Pending');
    return R(P.length?`**${P.length} pending approval(s)**\n`+list(P.map(a=>`${a.request} (${a.ref}) — requested by ${a.requestedBy}`)):'No approvals are waiting on you.',[go('Open approvals','c-workflow',{f:{status:'Pending'}})]);
  }
  if(/usage|seat|volume|quota/.test(q)){const used=sum(seriesFor([T],30));return R(`**Usage — last 30 days**\n${num(used)} verifications against ${num(t.seats)} licensed seats (${t.seats?Math.round(used/t.seats*100):0}%)`,hasMod(T,'analytics')?[go('Open analytics','c-analytics')]:[])}
  if(/ticket|support|help desk/.test(q)){const k=DB.tickets.filter(x=>x.tenantId===T),o=k.filter(x=>x.status!=='Resolved');return R(`**${o.length} open ticket(s)** of ${k.length}\n`+list(o.map(x=>`${x.id} — ${x.subject} (${x.status})`),4)+'\nTo open one, say "create ticket: <subject>".',[go('Open support','c-support')])}
  if(/exam/.test(q)){const E=DB.exams.filter(e=>e.tenantId===T);return R(`**${E.length} exam programs**\n`+list(E.map(e=>`${e.name} (${e.code}) — ${e.status}, ${fmtD(e.start)}`),4),[go('Open exams','c-exams')])}
  if(/user|team|member/.test(q)){const U=DB.users.filter(u=>u.tenantId===T);return R(`**${U.length} users**\nAdmins ${cnt(U,'role','Customer Admin')} · Analysts ${cnt(U,'role','Analyst')} · Viewers ${cnt(U,'role','Viewer')}`,[go('Open users','c-users')])}
  if(/role|permission|can i|access/.test(q)){const d={'Customer Admin':'You have full access, including configuration, users, approvals and upgrade requests.','Analyst':'You can operate verifications, alerts, cases, evidence, analytics and support. Configuration, users and approvals are read-only.','Viewer':'You have read-only access to subscribed modules.'}[UI.role];return R(`You are signed in as **${UI.role}**.\n${d}\nUse the user menu (top right) to preview another role.`)}
  if(/incident|status|outage|down/.test(q))return R(incidentsText()+`\n\nYour tenant is **${t.status}**.`,[go('Status page','c-support')]);
  return null;
}
function createTicket(raw){
  const m=raw.match(/(?:create|open|raise|new|log|file)\s+(?:a\s+|an\s+)?(?:support\s+)?ticket\s*(?:[:\-–]|about|for|regarding)?\s*(.*)$/i);if(!m)return null;
  const subj=m[1].trim();
  if(!subj)return R('What should the ticket say? Type for example:\n**create ticket: SSO login fails for proctors**');
  let T=isCust()?UI.ctenant:(UI.ptenant!=='all'?UI.ptenant:null);
  if(!T)return R('Pick a tenant in the top bar first, then I can create the ticket for it.');
  if(isCust()){const t=byId('tenants',T);if(!tenantActive(t))return R(`Your tenant is ${t?t.status:'unavailable'}, so changes are disabled.`);if(UI.role==='Viewer')return R('Viewers have read-only access and cannot open tickets. Switch role from the user menu, or ask an Analyst.')}
  const s=subj.charAt(0).toUpperCase()+subj.slice(1,120),tk={id:nid('TCK'),tenantId:T,subject:s,priority:/urgent|critical|down|outage|cannot|can't/i.test(subj)?'High':'Medium',status:'Open',assignee:'',created:nowISO(),description:'Created via TIPS Assistant: '+subj};
  DB.tickets.unshift(tk);notify('provider','New support ticket',`${tName(T)}: ${s}`,'support');log('Created ticket',s,T);save();rerender();
  return R(`Ticket **${tk.id}** created for ${tName(T)}\n"${s}" — priority ${tk.priority}.`,[isCust()?go('Open support','c-support',{q:tk.id}):go('Open support','support',{q:tk.id})]);
}
function helpText(){
  return isCust()?'I can:\n• summarize cases, alerts, verifications, evidence, approvals and usage\n• show your modules and request upgrades ("request upgrade evidence")\n• open pages ("open evidence")\n• look up IDs like CASE-5123\n• create tickets ("create ticket: …")\n• switch theme ("dark mode")':'I can:\n• summarize the platform, tenants, usage and quota\n• list failed provisioning tasks, incidents, integrations, tickets\n• look up a tenant by name ("tell me about Aurora") or an ID (TEN-1004)\n• open pages ("open audit")\n• create tickets ("create ticket: …") for the selected tenant\n• switch theme ("dark mode")';
}
function answer(raw){
  const q=raw.toLowerCase().trim();let m,r;
  if(/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(q))return R('Hello! Ask me about your data, or say "help" to see what I can do.');
  if(/^(thanks|thank you|thx|great|ok thanks)/.test(q))return R('You\'re welcome!');
  if(/^(help|what can you do|\?)$/.test(q)||/what can you do|how do you work|how can you help/.test(q))return R(helpText());
  if(/clear (the )?chat|reset chat|start over/.test(q)){setTimeout(()=>{msgs=[];store();welcome();renderMsgs()},50);return R('Clearing the conversation…');}
  if(/\b(dark|light|night) ?(mode|theme)\b|\btheme\b|^(dark|light)$/.test(q)){
    const t=/dark|night/.test(q)?'dark':/light/.test(q)?'light':(curTheme()==='dark'?'light':'dark');setTheme(t,true);return R(`Switched to **${t} mode**.`,[{l:t==='dark'?'Back to light':'Back to dark',fn:'theme',arg:t==='dark'?'light':'dark'}]);
  }
  if(/(switch|go|open|take me).*customer portal/.test(q)){setTimeout(()=>App.portal('customer'),60);return R('Switching to the **Customer Portal**.')}
  if(/(switch|go|open|take me).*provider console/.test(q)){setTimeout(()=>App.portal('provider'),60);return R('Switching to the **Provider Console**.')}
  if(r=createTicket(raw))return r;
  if(isCust()&&(m=q.match(/request (?:an? )?upgrade(?: for| to)?\s*(.*)$/))){
    const mod=modByText(m[1]);if(!mod)return R('Which module? For example: "request upgrade evidence". Modules: '+MODS.map(x=>x[1]).join(', ')+'.');
    if(UI.role!=='Customer Admin')return R('Only Customer Admins can request upgrades.');
    const t=byId('tenants',UI.ctenant);if(!tenantActive(t))return R('Your tenant is not active, so upgrade requests are disabled.');
    if(hasMod(UI.ctenant,mod[0]))return R(`**${mod[1]}** is already active on your plan.`);
    if(DB.tickets.some(k=>k.tenantId===UI.ctenant&&k.subject===`Upgrade request: ${mod[1]}`&&k.status!=='Resolved'))return R(`An upgrade request for **${mod[1]}** is already open.`,[go('Open support','c-support')]);
    App.reqUpgrade(null,mod[0]);return R(`Upgrade request for **${mod[1]}** sent to TIPS support.`,[go('Open support','c-support')]);
  }
  if(m=q.match(/\b(ten|case|tck|inc|evd|apr|ver|alr|usr|sub|prv)-\d+\b/))return describeId(m);
  if(m=q.match(/^(?:please\s+)?(?:go to|goto|open|show me|show|take me to|navigate to|visit)\s+(?:the\s+)?(.+?)(?:\s+page)?$/)){
    const p=matchPage(m[1]);if(p){setTimeout(()=>App.go(p[0]),60);return R(`Opening **${p[1].t}**.`)}
  }
  if(/^(what is|what's|what are|explain|describe|tell me about)\b/.test(q)){
    if(/\btips\b|this (app|platform)/.test(q))return R('**TIPS** is a test-integrity platform: identity verification, risk rules, alerts, investigation cases and tamper-evident evidence for exam programs. The Provider Console manages tenants, bundles and provisioning; the Customer Portal is what each exam body uses day to day.');
    const mod=modByText(q);if(mod){const on=isCust()?(hasMod(UI.ctenant,mod[0])?' It is **active** on your plan.':' It is **not active** on your plan.'):'';return R(`**${mod[1]}** — ${mod[2]}.${on}`)}
  }
  r=isCust()?customer(q):provider(q);if(r)return r;
  return R('I didn\'t quite catch that. Try asking about '+(isCust()?'cases, alerts, verifications, approvals, usage or your modules':'tenants, provisioning, incidents, usage, tickets or bundles')+', or say "help".');
}

/* ---- UI ---- */
const root=document.createElement('div');
root.innerHTML=`<button id="botfab" aria-label="Open TIPS Assistant" aria-expanded="false">${ic('chat')}</button><div id="botwin" role="dialog" aria-label="TIPS Assistant"><div class="bh"><div class="bav">AI</div><div class="bt2"><b>TIPS Assistant</b><span id="bctx"></span></div><button id="bclr" title="Clear conversation" aria-label="Clear conversation">${ic('trash')}</button><button id="bcls" title="Close" aria-label="Close assistant">${ic('x')}</button></div><div id="bmsgs" aria-live="polite"></div><div id="bchips"></div><form id="bform" autocomplete="off"><input id="bin" placeholder="Ask about tenants, cases, usage…" maxlength="300" aria-label="Message"><button type="submit" aria-label="Send">${ic('send')}</button></form></div>`;
document.body.appendChild(root);
function renderMsgs(){
  const el=$b('bmsgs');
  el.innerHTML=msgs.map((m,i)=>`<div class="bm ${m.r}">${fmt(m.t)}${m.a&&m.a.length?`<div class="bacts">${m.a.map((a,j)=>`<button class="btn sm" data-m="${i}" data-a="${j}">${esc(a.l)}</button>`).join('')}</div>`:''}</div>`).join('')+(typing?'<div class="bm b"><span class="dots"><i></i><i></i><i></i></span></div>':'');
  el.scrollTop=el.scrollHeight;
}
function renderChips(){const c=$b('bchips');if(!c)return;c.innerHTML=CHIPS[UI.portal==='customer'?'customer':'provider'].map(x=>`<button type="button" class="bchip">${esc(x)}</button>`).join('')}
window.botCtx=function(){const el=$b('bctx');if(!el)return;el.textContent=isCust()?`Customer Portal · ${tName(UI.ctenant)} · ${UI.role}`:`Provider Console · ${UI.ptenant==='all'?'all tenants':tName(UI.ptenant)}`;renderChips()};
function push(m){msgs.push(m);store();renderMsgs()}
function welcome(){push({r:'b',t:'Hi! I\'m the **TIPS Assistant**. I can look up live data in this demo, open pages, create support tickets and switch the theme.\nPick a suggestion below or type "help".'})}
function toggle(f){
  isOpen=f===undefined?!isOpen:f;$b('botwin').classList.toggle('on',isOpen);$b('botfab').innerHTML=ic(isOpen?'x':'chat');$b('botfab').setAttribute('aria-expanded',String(isOpen));
  if(isOpen){window.botCtx();if(!msgs.length)welcome();else renderMsgs();setTimeout(()=>$b('bin').focus(),50)}
}
function send(text){
  text=String(text).trim();if(!text||typing)return;
  hist.push(text);hi=hist.length;$b('bin').value='';window.botCtx();
  msgs.push({r:'u',t:text});typing=true;renderMsgs();
  setTimeout(()=>{let res;try{res=answer(text)}catch(e){console.error(e);res=R('Sorry — something went wrong while reading the demo data. Please try again.')}
    typing=false;push({r:'b',t:res.t,a:res.a});},350+Math.random()*350);
}
$b('botfab').onclick=()=>toggle();
$b('bcls').onclick=()=>toggle(false);
$b('bclr').onclick=()=>{msgs=[];store();typing=false;welcome()};
$b('bform').onsubmit=e=>{e.preventDefault();send($b('bin').value)};
$b('bin').onkeydown=e=>{if(e.key==='Escape'){toggle(false);return}if(e.key==='ArrowUp'&&hist.length){hi=Math.max(0,hi-1);e.target.value=hist[hi];e.preventDefault()}else if(e.key==='ArrowDown'&&hist.length){hi=Math.min(hist.length,hi+1);e.target.value=hist[hi]||'';e.preventDefault()}};
$b('bchips').onclick=e=>{const b=e.target.closest('.bchip');if(!b)return;const x=b.textContent;if(x==='Create a ticket'){const i=$b('bin');i.value='create ticket: ';i.focus();return}send(x)};
$b('bmsgs').onclick=e=>{const b=e.target.closest('button[data-m]');if(!b)return;const arr=(msgs[+b.dataset.m]||{}).a,a=arr&&arr[+b.dataset.a];if(!a)return;
  if(a.go)App.go(a.go,a.p);else if(a.fn==='theme')setTheme(a.arg);else if(a.fn==='asCustomer'){UI.ctenant=a.arg;UI.role='Customer Admin';App.go('c-overview')}else if(a.fn==='upgrade'){const r=answer('request upgrade '+modName(a.arg));push({r:'b',t:r.t,a:r.a});return}
  if(innerWidth<560)toggle(false)};
window.TIPSBot={answer,send};
window.themeIcon();window.botCtx();
})();
</script>
